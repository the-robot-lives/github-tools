name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test deps
        run: python -m pip install -r requirements-test.txt

      - name: Syntax checks
        run: |
          make compile
          bash -n bin/submodule-commit
          bash -n bin/submodule-status

      # gh-wait tests put a scripted fake `gh`/`kubectl` first on PATH; nothing
      # here talks to the real GitHub API.
      - name: Tests + coverage gate
        run: python -m pytest tests -q -p no:cacheprovider --durations=10 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
